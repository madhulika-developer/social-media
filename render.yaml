services:
  - type: web
    name: social-media
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn socialapp.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
